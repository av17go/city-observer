<div class="card">
    <h2 class="header">
        {{post.title}}
    </h2>
    <div class="content-section" >
        <div>
            <p>
                {{post.content}}
            </p>
        </div>
        <div>
            <div *ngFor="let image of post.image">
                <img [attr.src]="image.fullsize" [attr.alt]="image.alt">
            </div>
        </div>
    </div>
</div>
